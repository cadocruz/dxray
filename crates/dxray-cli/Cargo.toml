[package]
name = "dxray-cli"
version.workspace = true
description = "Dependency-free static analyzer and compatibility linter for Windows games on Linux."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["games", "steam", "heroic", "proton", "linux"]
categories = ["command-line-utilities"]

[[bin]]
name = "dxray"
path = "src/main.rs"

[dependencies]
dxray-core = { path = "../dxray-core", version = "0.2.0" }
dxray-pe = { path = "../dxray-pe", version = "0.2.0" }
clap = { version = "4", features = ["derive"] }

[lints]
workspace = true

[dev-dependencies]
dxray-core = { path = "../dxray-core", version = "0.2.0", features = ["test-support"] }
serde_json = "1"
