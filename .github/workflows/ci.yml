name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.88.0", stable]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --workspace --no-fail-fast

  install:
    name: Install binaries
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Install and smoke-test binaries
        env:
          CARGO_INSTALL_ROOT: ${{ runner.temp }}/dxray-install
        run: |
          cargo install --path crates/dxray-cli --locked
          cargo install --path crates/dxray-tui --locked
          "$CARGO_INSTALL_ROOT/bin/dxray" --version
          "$CARGO_INSTALL_ROOT/bin/dxray-tui" --version
